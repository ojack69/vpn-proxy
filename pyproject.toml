[project]
name = "vpn-proxy"
version = "0.2.0"
description = "WireGuard VPN in Docker that transparently redirects HTTP/HTTPS traffic to an intercepting proxy"
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = [
    "docker>=7.1",
    "psutil>=6.0",
    "segno>=1.6",
    "textual>=1.0",
]

[project.urls]
Repository = "https://github.com/ojack69/vpn-proxy"

[project.scripts]
vpn-proxy = "vpn_proxy.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vpn_proxy"]

[dependency-groups]
dev = ["pytest>=8"]
